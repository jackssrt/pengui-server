[package]
name = "pengui-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-compression = { version = "0.4.40", features = ["tokio", "zstd"] }
axum = { version = "0.8.8", features = ["macros", "ws"] }
axum-client-ip = "1.3.1"
axum-extra = { version = "0.12.5", features = ["typed-header"] }
bstr = "1.12.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["deref"] }
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
rand = "0.10.0"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
signal-hook = "0.4.3"
signal-hook-tokio = { version = "0.4.0", features = ["futures-v0_3"] }
sqlx = { version = "0.8.6", features = ["mysql", "runtime-tokio", "chrono"] }
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "trace", "tracing"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
walkdir = "2.5.0"
yaml_serde = "0.10.3"
