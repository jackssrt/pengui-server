services:
    db:
        container_name: db
        image: mariadb
        # command: --default-authentication-plugin=mysql_native_password
        restart: always
        environment:
            MARIADB_ROOT_PASSWORD: ynoserver
            MARIADB_DATABASE: ynoserver
            MARIADB_USER: ynoserver
            MARIADB_PASSWORD: ynoserver
        ports:
            - 13306:3306
        volumes:
            - ./db/data:/var/lib/mysql
            - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
    mysql_data:
