services:
    db:
        container_name: db
        image: mysql
        # command: --default-authentication-plugin=mysql_native_password
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ynoserver
            MYSQL_DATABASE: ynoserver
            MYSQL_USER: ynoserver
            MYSQL_PASSWORD: ynoserver
        ports:
            - 13306:3306
        volumes:
            - ./db/data:/var/lib/mysql
            - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
            - ./db/my.cnf:/etc/mysql/my.cnf

volumes:
    mysql_data:
